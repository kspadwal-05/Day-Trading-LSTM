<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day Trading LSTM Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .card h3 {
            margin-bottom: 15px;
            color: #4a5568;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #5a67d8;
        }
        
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .results {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        .error {
            background: #fed7d7;
            color: #c53030;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        
        .success {
            background: #c6f6d5;
            color: #2f855a;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        
        .chart-container {
            position: relative;
            height: 400px;
            margin-top: 20px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .stat-card {
            background: #f7fafc;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2d3748;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #718096;
            margin-top: 5px;
        }
        
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Day Trading LSTM Dashboard</h1>
            <p>AI-powered stock prediction and trading signals</p>
        </div>
        
        <div class="dashboard">
            <div class="card">
                <h3>Stock Data</h3>
                <div class="form-group">
                    <label for="symbol">Symbol:</label>
                    <input type="text" id="symbol" placeholder="AAPL" value="AAPL">
                </div>
                <div class="form-group">
                    <label for="period">Period:</label>
                    <select id="period">
                        <option value="7d">7 Days</option>
                        <option value="1mo">1 Month</option>
                        <option value="3mo">3 Months</option>
                        <option value="1y">1 Year</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="interval">Interval:</label>
                    <select id="interval">
                        <option value="1m">1 Minute</option>
                        <option value="5m">5 Minutes</option>
                        <option value="15m">15 Minutes</option>
                        <option value="1h">1 Hour</option>
                        <option value="1d">1 Day</option>
                    </select>
                </div>
                <button class="btn" onclick="fetchData()">Fetch Data</button>
            </div>
            
            <div class="card">
                <h3>Forecast</h3>
                <div class="form-group">
                    <label for="forecastSymbol">Symbol:</label>
                    <input type="text" id="forecastSymbol" placeholder="AAPL" value="AAPL">
                </div>
                <div class="form-group">
                    <label for="horizon">Horizon (steps):</label>
                    <input type="number" id="horizon" value="60" min="1" max="240">
                </div>
                <button class="btn" onclick="getForecast()">Get Forecast</button>
            </div>
        </div>
        
        <div class="dashboard">
            <div class="card">
                <h3>Trading Signals</h3>
                <div class="form-group">
                    <label for="signalSymbol">Symbol:</label>
                    <input type="text" id="signalSymbol" placeholder="AAPL" value="AAPL">
                </div>
                <div class="form-group">
                    <label for="fastPeriod">Fast EMA:</label>
                    <input type="number" id="fastPeriod" value="9" min="1">
                </div>
                <div class="form-group">
                    <label for="slowPeriod">Slow EMA:</label>
                    <input type="number" id="slowPeriod" value="21" min="1">
                </div>
                <button class="btn" onclick="getSignals()">Get Signals</button>
            </div>
            
            <div class="card">
                <h3>Backtest</h3>
                <div class="form-group">
                    <label for="backtestSymbol">Symbol:</label>
                    <input type="text" id="backtestSymbol" placeholder="AAPL" value="AAPL">
                </div>
                <div class="form-group">
                    <label for="backtestPeriod">Period:</label>
                    <select id="backtestPeriod">
                        <option value="3mo">3 Months</option>
                        <option value="6mo">6 Months</option>
                        <option value="1y">1 Year</option>
                        <option value="2y">2 Years</option>
                    </select>
                </div>
                <button class="btn" onclick="runBacktest()">Run Backtest</button>
            </div>
        </div>
        
        <div class="results">
            <div id="results"></div>
            <div class="chart-container">
                <canvas id="chart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        let chart = null;
        
        function showLoading() {
            document.getElementById('results').innerHTML = '<div class="loading">Loading...</div>';
        }
        
        function showError(message) {
            document.getElementById('results').innerHTML = `<div class="error">Error: ${message}</div>`;
        }
        
        function showSuccess(message) {
            document.getElementById('results').innerHTML = `<div class="success">${message}</div>`;
        }
        
        async function fetchData() {
            showLoading();
            try {
                const symbol = document.getElementById('symbol').value;
                const period = document.getElementById('period').value;
                const interval = document.getElementById('interval').value;
                
                const response = await fetch(`${API_BASE}/data/history?symbol=${symbol}&period=${period}&interval=${interval}`);
                const data = await response.json();
                
                if (response.ok) {
                    showSuccess(`Fetched ${symbol} data successfully`);
                    // Parse CSV and create chart
                    const lines = data.df_csv.split('\n');
                    const labels = [];
                    const prices = [];
                    
                    for (let i = 1; i < lines.length - 1; i++) {
                        const row = lines[i].split(',');
                        if (row.length > 1) {
                            labels.push(row[0]);
                            prices.push(parseFloat(row[4])); // Close price
                        }
                    }
                    
                    createChart(labels, prices, `${symbol} Price History`);
                } else {
                    showError(data.detail || 'Failed to fetch data');
                }
            } catch (error) {
                showError(error.message);
            }
        }
        
        async function getForecast() {
            showLoading();
            try {
                const symbol = document.getElementById('forecastSymbol').value;
                const horizon = document.getElementById('horizon').value;
                
                const response = await fetch(`${API_BASE}/forecast/next?symbol=${symbol}&horizon=${horizon}`);
                const data = await response.json();
                
                if (response.ok) {
                    showSuccess(`Generated ${horizon} step forecast for ${symbol}`);
                    createChart([], data.predicted, `${symbol} Forecast`);
                } else {
                    showError(data.detail || 'Failed to get forecast');
                }
            } catch (error) {
                showError(error.message);
            }
        }
        
        async function getSignals() {
            showLoading();
            try {
                const symbol = document.getElementById('signalSymbol').value;
                const fast = document.getElementById('fastPeriod').value;
                const slow = document.getElementById('slowPeriod').value;
                
                const response = await fetch(`${API_BASE}/signals/?symbol=${symbol}&fast=${fast}&slow=${slow}`);
                const data = await response.json();
                
                if (response.ok) {
                    const signals = data.signals.filter(s => s.signals.length > 0);
                    showSuccess(`Found ${signals.length} trading signals for ${symbol}`);
                    
                    let html = '<h4>Recent Signals:</h4>';
                    signals.slice(-10).forEach(signal => {
                        html += `<div class="stat-card">
                            <div>${signal.timestamp}</div>
                            <div>Price: $${signal.price.toFixed(2)}</div>
                            <div>Signals: ${signal.signals.join(', ')}</div>
                        </div>`;
                    });
                    document.getElementById('results').innerHTML = html;
                } else {
                    showError(data.detail || 'Failed to get signals');
                }
            } catch (error) {
                showError(error.message);
            }
        }
        
        async function runBacktest() {
            showLoading();
            try {
                const symbol = document.getElementById('backtestSymbol').value;
                const period = document.getElementById('backtestPeriod').value;
                
                const response = await fetch(`${API_BASE}/backtest/crossover?symbol=${symbol}&period=${period}`);
                const data = await response.json();
                
                if (response.ok) {
                    showSuccess(`Backtest completed for ${symbol}`);
                    
                    const summary = data.summary;
                    let html = '<div class="stats-grid">';
                    html += `<div class="stat-card"><div class="stat-value">${summary.total_return_pct}%</div><div class="stat-label">Total Return</div></div>`;
                    html += `<div class="stat-card"><div class="stat-value">${summary.win_rate_pct}%</div><div class="stat-label">Win Rate</div></div>`;
                    html += `<div class="stat-card"><div class="stat-value">${summary.total_trades}</div><div class="stat-label">Total Trades</div></div>`;
                    html += `<div class="stat-card"><div class="stat-value">${summary.max_drawdown_pct}%</div><div class="stat-label">Max Drawdown</div></div>`;
                    html += '</div>';
                    
                    document.getElementById('results').innerHTML = html;
                    createChart([], data.equity_curve, 'Equity Curve');
                } else {
                    showError(data.detail || 'Failed to run backtest');
                }
            } catch (error) {
                showError(error.message);
            }
        }
        
        function createChart(labels, data, title) {
            const ctx = document.getElementById('chart').getContext('2d');
            
            if (chart) {
                chart.destroy();
            }
            
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels.length > 0 ? labels : data.map((_, i) => i),
                    datasets: [{
                        label: title,
                        data: data,
                        borderColor: 'rgb(75, 192, 192)',
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: false
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
